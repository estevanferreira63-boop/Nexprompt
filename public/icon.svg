<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Subtle neural grid lines -->
  <path d="M96 256 H416 M256 96 V416 M140 140 L372 372 M140 372 L372 140" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Outer hexagonal energy ring -->
  <polygon points="256,76 406,162 406,350 256,436 106,350 106,162" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Network nodes -->
  <circle cx="256" cy="76" r="14" fill="#06b6d4" filter="url(#neonGlow)"/>
  <circle cx="406" cy="162" r="12" fill="#3b82f6"/>
  <circle cx="406" cy="350" r="14" fill="#8b5cf6" filter="url(#neonGlow)"/>
  <circle cx="256" cy="436" r="14" fill="#ec4899" filter="url(#neonGlow)"/>
  <circle cx="106" cy="350" r="12" fill="#10b981"/>
  <circle cx="106" cy="162" r="14" fill="#06b6d4" filter="url(#neonGlow)"/>

  <!-- Center Shield/Core with Database Layers -->
  <g transform="translate(196, 176)">
    <!-- Layer 1 -->
    <ellipse cx="60" cy="30" rx="55" ry="16" fill="url(#accentGrad)" opacity="0.9"/>
    <!-- Cylinder 1 -->
    <path d="M5 30 V50 C5 60 115 60 115 50 V30 Z" fill="url(#accentGrad)" opacity="0.8"/>
    <ellipse cx="60" cy="50" rx="55" ry="16" fill="#0284c7"/>
    <!-- Cylinder 2 -->
    <path d="M5 50 V70 C5 80 115 80 115 70 V50 Z" fill="#2563eb" opacity="0.75"/>
    <ellipse cx="60" cy="70" rx="55" ry="16" fill="#1d4ed8"/>
    <!-- Cylinder 3 -->
    <path d="M5 70 V90 C5 100 115 100 115 90 V70 Z" fill="#7c3aed" opacity="0.85"/>
    <ellipse cx="60" cy="90" rx="55" ry="16" fill="#6d28d9"/>
  </g>

  <!-- Number 100 Overlay Emblem -->
  <text x="256" y="356" text-anchor="middle" font-family="'Fira Code', monospace" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-2" filter="url(#neonGlow)">100</text>
  <text x="256" y="394" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#22d3ee" letter-spacing="4">DATA &amp; AI</text>
</svg>
